<!DOCTYPE html>
<html lang="en">
<head>
  <title>One Direction Fan Page</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Send+Flowers&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lobster+Two&family=Send+Flowers&display=swap" rel="stylesheet">
  <meta charset="utf-8">
</head>
<body>
  <center>
    <h1>ONE DIRECTION</h1>
    <p class="subtitle">Where We Are Tour</p>
    <ul>
      <li id="video">Video - Night Changes</li>
      <hr>
      <video controls width="300" height="500" loop autoplay muted preload="auto">
        <source src="klip video.mp4" type="video/mp4">
        <track kind="captions" src="klip video.mp4" srclang="en" label="English">
      </video>
      <p class="media-caption">official music video for Night Changes</p>

      <li id="audio">Audio - Night Changes</li>
      <hr>
      <audio controls>
        <source src="night changes.mp3" type="audio/mp3">
      </audio>
      <p class="media-caption">Listen to the beautiful harmonies</p>

      <li id="gambar">Gallery</li>
      <hr>
      <picture>
        <source media="(max-width: 600px)" srcset="1D.jpg">
        <source media="(max-width: 1200px)" srcset="https://th.bing.com/th/id/OIP.UPyS.o3M-OH0Np0kXk17upgHaE?w=251&h=180&c=7&r=0&o=5&pid=1.7">
        <img src="1D.jpg" alt="pic 1" style="width: auto;">
      </picture>
    </ul>
  </center>
  <script src="javascript.js"></script>
</body>
</html>
